<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق فيسبوك</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header {
            background-color: #4267B2;
            width: 100%;
            padding: 15px 0;
            color: white;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: bold;
        }

        .container {
            margin-top: 30px;
            width: 90%;
            max-width: 400px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            direction: rtl;
            text-align: right;
        }

        .login-btn {
            background-color: #1877f2;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
        }

        .login-btn:hover {
            opacity: 1;
        }

        .link-forgot {
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-top: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #dadde1;
        }

        .create-btn {
            background-color: #42b72a;
            color: white;
            padding: 12px 16px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            width: auto;
        }

        .logo-placeholder {
            margin-bottom: 20px;
        }

        .logo-placeholder img {
            width: 150px;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>facebook</h1>
    </div>

    <div class="container">
        <div class="logo-placeholder">
            <!-- Placeholder for a simple blue F or the Facebook wordmark -->
            <h2 style="color: #1877f2; margin: 0; font-size: 36px; font-weight: bold;">f</h2>
        </div>

        <form action="#" method="POST">
            <input type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
            <input type="password" placeholder="كلمة السر" required>

            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>

        <a href="#" class="link-forgot">هل نسيت كلمة السر؟</a>

        <button class="create-btn">إنشاء حساب جديد</button>
    </div>

    <p style="color: #606770; font-size: 12px; margin-top: 30px;">
        <a href="#" style="color: #606770; text-decoration: none; margin-left: 10px;">العربية</a>
        <a href="#" style="color: #606770; text-decoration: none; margin-left: 10px;">English</a>
        <a href="#" style="color: #606770; text-decoration: none; margin-left: 10px;">Deutsch</a>
    </p>

</body>
</html>
